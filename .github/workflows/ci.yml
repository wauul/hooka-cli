name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: '*.tgz'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
  installed-package:
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, node: 18 }
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 22 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: package
      - shell: bash
        run: |
          npm install -g ./hooka-relay-cli-*.tgz
          hooka --version
          hooka --help
          hooka fake-receiver succeed
          ROOT=$(npm root -g)
          node -e 'const p = require(process.argv[1]); if (typeof p.createProgram !== "function") process.exit(1)' "$ROOT/hooka-relay-cli"
          node --input-type=module -e 'const {pathToFileURL}=await import("node:url");const p=await import(pathToFileURL(process.argv[1]));if(typeof p.createProgram!=="function")process.exit(1)' "$ROOT/hooka-relay-cli/dist/index.js"
